name: verify

# The gate that protects a merge. It runs the same script a developer runs, so a
# pull request cannot pass a check that the local command does not make, and a
# local run cannot pass a check that CI then fails.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per branch, newest wins. A superseded push has nothing left to prove.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and the job needs nothing else. This repository is public, so a
# workflow that ran with a writable token on a fork's pull request would hand
# that token to code the fork controls.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The scanner the audit step in scripts/verify.sh calls.
      #
      # Verified against a digest pinned in scripts/osv-scanner.sha256 before it
      # is made executable. A versioned download URL is not integrity: a release
      # asset can be replaced, and fetching the checksum from that same release
      # would only prove the artifact matches itself. The digest is in the
      # repository, under review, which is what makes it evidence.
      #
      # Google publishes actions that run the scanner, not ones that install it.
      # Using those would scan twice and leave verify.sh unable to fail on the
      # audit itself, so the binary goes on PATH and the script stays the single
      # entry point.
      - name: Install the pinned dependency scanner
        run: |
          set -euo pipefail
          read -r version digest < <(grep -v '^#' scripts/osv-scanner.sha256 | grep -v '^$')
          echo "osv-scanner ${version}"

          # The version is read out of the same file as the digest, so the two
          # cannot disagree, and neither is written twice.
          asset="osv-scanner_linux_amd64"
          curl -fsSL -o "${asset}" \
            "https://github.com/google/osv-scanner/releases/download/${version}/${asset}"

          echo "${digest}  ${asset}" | sha256sum --check --strict

          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${asset}" "${HOME}/.local/bin/osv-scanner"
          rm -f "${asset}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # The runner already has a Docker daemon, so Testcontainers needs no
      # service container and no port mapping declared here.
      - name: Every gate
        run: ./scripts/verify.sh
