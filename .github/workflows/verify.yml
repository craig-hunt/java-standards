name: verify

# The gate that protects a merge. It runs the same script a developer runs, so a
# pull request cannot pass a check that the local command does not make, and a
# local run cannot pass a check that CI then fails.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per branch, newest wins. A superseded push has nothing left to prove.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and the job needs nothing else. This repository is public, so a
# workflow that ran with a writable token on a fork's pull request would hand
# that token to code the fork controls.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The scanner the audit step in scripts/verify.sh calls.
      #
      # The version is read out of scripts/toolchain.Dockerfile rather than
      # written again here. Pinning it in two files is the drift the standard
      # that every version lives in one place exists to prevent, and a scanner
      # that differs between CI and a developer's machine produces an argument
      # about whose run to believe.
      #
      # Google publishes actions that run the scanner, not ones that install it.
      # Using those would scan twice and leave verify.sh unable to fail on the
      # audit itself, so the binary goes on PATH and the script stays the single
      # entry point.
      - name: Install the pinned dependency scanner
        run: |
          set -euo pipefail
          version=$(grep -oE 'osv-scanner:v[0-9]+\.[0-9]+\.[0-9]+' \
            scripts/toolchain.Dockerfile | head -1 | cut -d: -f2)
          echo "osv-scanner ${version}"
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o "${HOME}/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${version}/osv-scanner_linux_amd64"
          chmod +x "${HOME}/.local/bin/osv-scanner"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # The runner already has a Docker daemon, so Testcontainers needs no
      # service container and no port mapping declared here.
      - name: Every gate
        run: ./scripts/verify.sh
